name: Waka Readme
on:
  workflow_dispatch:
  schedule:
    - cron: 0 19 * * *
permissions:
  contents: write
concurrency:
  group: waka-readme
  cancel-in-progress: true
jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: all_time
          SHOW_TITLE: false
          BLOCKS: ░█
          LANG_COUNT: 11
          IGNORED_LANGUAGES: Other
          COMMIT_MESSAGE: 'chore: updated graph w/ new metrics'
          COMMITTER_NAME: Irfan Shadik Rishad
          COMMITTER_EMAIL: 77362427+irfanshadikrishad@users.noreply.github.com
          AUTHOR_NAME: Irfan Shadik Rishad
          AUTHOR_EMAIL: 77362427+irfanshadikrishad@users.noreply.github.com
